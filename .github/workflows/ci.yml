name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      GPT_REPLIES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.demo_autoreply
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: avito_ci
          POSTGRES_USER: avito
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avito -d avito_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_NAME: avito_ci
      DATABASE_USER: avito
      DATABASE_PASSWORD: ci-disposable-password
      JWT_SECRET: ci-only-signing-key-at-least-32-bytes-long
      ALLOW_DISPOSABLE_POSTGRES_TEST: 'yes'
      GPT_REPLIES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.verify_postgres
